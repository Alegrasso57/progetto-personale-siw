<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Scopri gli animali disponibili per l'adozione al Rifugio Amico.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Animali in adozione — Rifugio Amico</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" th:if="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty}">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="@{/specie}">Specie</a>
        <a th:href="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
        <a th:href="@{/recensioni-volontari}">Recensioni</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-header-title">Animali disponibili per l'adozione</h1>

            <!-- Barra di ricerca in React (vedi frontend-ricerca-animali/src/ricercaAnimali.jsx):
                 monta qui il form, e "porta" (React portal) l'elenco sotto dentro
                 #risultati-animali-root. Ricerca live: aggiorna l'elenco mentre si
                 scrive, senza ricaricare la pagina e senza bisogno di premere Invio. -->
            <div id="ricerca-animali-root" class="page-header-end"
                 th:attr="data-valore-iniziale=${cerca},data-api-ricerca=@{/api/animali/ricerca}"></div>
        </div>

        <!-- Elenco animali: renderizzato da React (portal dal componente sopra),
             a partire da questi risultati iniziali (stessa lista di animaleList,
             solo i campi che servono alla card). -->
        <div id="risultati-animali-root"></div>
        <script th:inline="javascript">
            window.__ANIMALI_INIZIALI__ = /*[[${animaleListJson}]]*/ [];
        </script>
    </div>

    <!-- Barra di ricerca + elenco animali in React: bundle gia' compilato con
         Vite (vedi frontend-ricerca-animali/), React incluso, nessuna
         dipendenza a runtime. -->
    <script th:src="@{/js/ricercaAnimali.js}"></script>
</body>
</html>
