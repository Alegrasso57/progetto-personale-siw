<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Scopri gli animali disponibili per l'adozione al Rifugio Amico.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Animali in adozione — Rifugio Amico</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" sec:authorize="hasAuthority('VOLONTARIO')">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="${#authorization.expression('hasAuthority(''VOLONTARIO'')')} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-header-title">Animali disponibili per l'adozione</h1>

            <!-- Barra di ricerca ridotta, spostata in alto a destra -->
            <form th:action="@{/animali}" method="get" class="search-bar search-bar-compact page-header-end" id="form-ricerca-animali">
                <input type="text" name="cerca" id="cerca-animali"
                       th:value="${cerca}"
                       placeholder="Cerca…"
                       aria-label="Cerca animale">
                <button type="submit">Cerca</button>
            </form>
        </div>

        <div class="card-grid">
            <div class="animal-card" th:each="animale : ${animaleList}">
                <span th:switch="${animale.stato.name()}">
                    <span th:case="'DISPONIBILE'" class="badge badge-disponibile">Disponibile</span>
                    <span th:case="'IN_VALUTAZIONE'" class="badge badge-in-valutazione">In valutazione</span>
                    <span th:case="'ADOTTATO'" class="badge badge-adottato">Adottato</span>
                </span>

                <h3><a th:href="@{'/animali/' + ${animale.id}}" th:text="${animale.nome}">Nome</a></h3>

                <div class="animal-meta">
                    <span class="animal-tag" th:text="${animale.specie}">Specie</span>
                    <span class="animal-tag" th:if="${animale.razza != null and !animale.razza.isEmpty()}" th:text="${animale.razza}">Razza</span>
                    <span class="animal-tag" th:if="${animale.eta != null}" th:text="${animale.eta} + ' anni'">Età</span>
                    <span class="animal-tag" th:if="${animale.sesso != null and !animale.sesso.isEmpty()}" th:text="${animale.sesso}">Sesso</span>
                </div>

                <p class="animal-desc"
                   th:if="${animale.descrizione != null and !animale.descrizione.isEmpty()}"
                   th:text="${#strings.abbreviate(animale.descrizione, 120)}">Descrizione</p>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(animaleList)}">Al momento non ci sono animali disponibili per la ricerca effettuata.</p>
    </div>
</body>
</html>
