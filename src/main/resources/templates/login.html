<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Login</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
    </nav>

    <div class="container">
        <h1>Accedi</h1>

        <form th:action="@{/login}" method="post">
            <label>Username: <input type="text" name="username"></label>
            <label>Password: <input type="password" name="password"></label>
            <button type="submit">Accedi</button>
        </form>

        <p th:if="${param.error}" class="errore">Username o password errati.</p>

        <p><a th:href="@{/register}">Non hai un account? Registrati</a></p>
        <p><a th:href="@{/}">Torna alla home</a></p>
    </div>
</body>
</html>
