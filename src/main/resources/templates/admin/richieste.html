<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Richieste di adozione — Rifugio Amico</title>
</head>
<body>
    <nav th:replace="~{fragments/nav :: navbarCompleta}"></nav>

    <div class="container">
        <h1>Richieste di adozione da valutare</h1>

        <!-- Barra di ricerca per nome animale o utente -->
        <form th:action="@{/admin/richieste}" method="get" class="search-bar" id="form-ricerca-richieste">
            <input type="text" name="cerca" id="cerca-richieste"
                   th:value="${cerca}"
                   placeholder="Cerca per nome animale o utente…"
                   aria-label="Cerca richiesta">
            <button type="submit">Cerca</button>
        </form>

        <div class="card" th:each="richiesta : ${richiestaList}">
            <span th:switch="${richiesta.stato.name()}">
                <span th:case="'IN_ATTESA'" class="badge badge-in-valutazione">In attesa</span>
                <span th:case="'APPROVATA'" class="badge badge-disponibile">Approvata</span>
                <span th:case="'RIFIUTATA'" class="badge badge-adottato">Rifiutata</span>
            </span>

            <p th:text="'Animale: ' + ${richiesta.animale.nome}">Animale</p>
            <p th:text="'Richiesta da: ' + ${richiesta.adottante.nome} + ' ' + ${richiesta.adottante.cognome}">Utente</p>
            <p th:text="'Data richiesta: ' + ${#temporals.format(richiesta.dataRichiesta, 'dd/MM/yyyy')}">Data</p>

            <!-- Lo slot che l'utente ha scelto fra quelli che hai reso disponibili -->
            <p th:if="${richiesta.turno != null}"
               th:text="'Orario richiesto per la visita: ' + ${#temporals.format(richiesta.turno.data, 'dd/MM/yyyy')}
                        + ' ore ' + ${#temporals.format(richiesta.turno.oraInizio, 'HH:mm')}
                        + ' - ' + ${#temporals.format(richiesta.turno.oraFine, 'HH:mm')}">Orario</p>

            <p th:if="${richiesta.motivazione != null and !richiesta.motivazione.isEmpty()}"
               th:text="'Motivazione: &quot;' + ${richiesta.motivazione} + '&quot;'">Motivazione</p>

            <div class="actions" th:if="${richiesta.stato.name() == 'IN_ATTESA'}">
                <form th:action="@{'/admin/richieste/' + ${richiesta.id} + '/approva'}"
                      method="post" class="form-inline">
                    <button type="submit" class="btn-action btn-modifica">Approva</button>
                </form>
                <form th:action="@{'/admin/richieste/' + ${richiesta.id} + '/rifiuta'}"
                      method="post" class="form-inline">
                    <button type="submit" class="btn-action btn-elimina">Rifiuta</button>
                </form>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(richiestaList)}">Non ci sono richieste in attesa per la ricerca effettuata.</p>

        <p style="margin-top:2rem;"><a th:href="@{/}">← Torna alla home</a></p>
    </div>
</body>
</html>
