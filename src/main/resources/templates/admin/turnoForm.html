<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Turno</title>
</head>
<body>
<div class="container">
    <h1 th:text="${turno == null} ? 'Nuovo turno di disponibilità' : 'Modifica turno'">Turno</h1>

    <p th:if="${errore != null}" th:text="${errore}" class="errore">Messaggio di errore</p>

    <form th:action="${turno == null}
                     ? @{/admin/turni}
                     : @{'/admin/turni/' + ${turno.id} + '/modifica'}"
          method="post">

        <label>Data:
            <input type="date" name="data" required
                   th:value="${turno != null} ? ${turno.data} : ''">
        </label>

        <label>Ora di inizio:
            <input type="time" name="oraInizio" required
                   th:value="${turno != null} ? ${#temporals.format(turno.oraInizio, 'HH:mm')} : ''">
        </label>

        <label>Ora di fine:
            <input type="time" name="oraFine" required
                   th:value="${turno != null} ? ${#temporals.format(turno.oraFine, 'HH:mm')} : ''">
        </label>


        <button type="submit" th:text="${turno == null} ? 'Salva turno' : 'Salva modifiche'">Salva</button>
    </form>

    <p><a th:href="@{/admin/turni}">Annulla</a></p>
</div>
</body>
</html>
