<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Nav bar unica per tutte le pagine "complete" del sito (fa eccezione solo
    la nav minima di login/register/pagine di errore, che mostra solo "Home").
    Si modifica in un solo posto, questo file, e il cambiamento vale ovunque.

    "Recensioni" e' pubblica: chiunque puo' leggere le recensioni sull'operato
    degli amministratori, ma solo un utente registrato puo' scriverne.
    La voce "Turni" e il menu "Area admin" compaiono solo a chi ha authority
    ADMIN: i turni sono gli slot di disponibilita' che l'admin mette a
    disposizione, e li gestisce soltanto lui.

    Se in futuro vuoi mostrare un count accanto a una voce (es. "Animali (12)"),
    il posto dove esporlo a tutte le pagine e' GlobalController, con un metodo
    @ModelAttribute("numeroAnimali"): qui basterebbe poi un th:text.
-->
<nav th:fragment="navbarCompleta" class="main-nav">
    <a th:href="@{/}">Home</a>

    <div class="nav-item-dropdown">
        <a th:href="@{/animali}">Animali</a>
        <div class="nav-dropdown-menu"
             th:if="${userDetails != null and !userDetails.authorities.?[authority == 'ADMIN'].empty}">
            <a th:href="@{/admin/animali}">Gestione animali</a>
            <a th:href="@{/admin/richieste}">Richieste di adozione da valutare</a>
            <a th:href="@{/admin/analisi-prestazioni}">Analisi delle prestazioni</a>
        </div>
    </div>

    <a th:href="@{/specie}">Specie</a>

    <a th:href="@{/recensioni}">Recensioni</a>

    <!-- Turni: solo l'admin, che li inserisce -->
    <a th:href="@{/admin/turni}"
       th:if="${userDetails != null and !userDetails.authorities.?[authority == 'ADMIN'].empty}">Turni</a>

    <!-- Le proprie richieste: solo l'utente normale -->
    <a th:href="@{/le-mie-richieste}"
       th:if="${userDetails != null and !userDetails.authorities.?[authority == 'UTENTE'].empty}">Le mie richieste</a>
</nav>
</body>
</html>
