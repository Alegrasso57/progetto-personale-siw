<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Recensione</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" th:if="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty}">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
    </nav>

    <div class="container">
        <h1 th:text="'Recensione per ' + ${animale.nome}">Recensione</h1>

        <form th:action="${recensione.id == null} ? @{'/animali/' + ${animale.id} + '/recensioni'} : @{'/recensioni/' + ${recensione.id} + '/modifica'}"
              method="post" th:object="${recensione}">
            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
            </div>

            <label>Voto (1-5):
                <input type="number" th:field="*{voto}" min="1" max="5">
            </label>
            <span th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}" class="errore"></span>

            <label>Testo:
                <textarea th:field="*{testo}" rows="4"></textarea>
            </label>
            <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}" class="errore"></span>

            <button type="submit">Salva recensione</button>
        </form>
    </div>
</body>
</html>
