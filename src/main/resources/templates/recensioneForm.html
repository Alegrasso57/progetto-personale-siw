<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Recensione</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" sec:authorize="hasAuthority('VOLONTARIO')">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="${#authorization.expression('hasAuthority(''VOLONTARIO'')')} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
    </nav>

    <div class="container">
        <h1 th:text="'Recensione per ' + ${animale.nome}">Recensione</h1>

        <p th:if="${errore != null}" th:text="${errore}" class="errore">Messaggio di errore</p>

        <form th:action="${recensione.id == null} ? @{'/animali/' + ${animale.id} + '/recensioni'} : @{'/recensioni/' + ${recensione.id} + '/modifica'}"
              method="post">
            <label>Voto (1-5):
                <input type="number" name="voto" min="1" max="5" th:value="${recensione.voto}">
            </label>
            <label>Testo:
                <textarea name="testo" rows="4" th:text="${recensione.testo}"></textarea>
            </label>
            <button type="submit">Salva recensione</button>
        </form>
    </div>
</body>
</html>
