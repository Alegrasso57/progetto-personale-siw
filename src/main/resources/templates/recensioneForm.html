<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Recensione</title>
</head>
<body>
    <nav th:replace="~{fragments/nav :: navbarCompleta}"></nav>

    <div class="container">
        <h1 th:text="${recensione.id == null} ? 'Scrivi una recensione' : 'Modifica la tua recensione'">Recensione</h1>

       
        <form th:action="${recensione.id == null}
                         ? @{/recensioni}
                         : @{'/recensioni/' + ${recensione.id} + '/modifica'}"
              method="post" th:object="${recensione}">

            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
            </div>

           
            <label th:if="${recensione.id == null}">Amministratore da recensire:
                <select name="adminId" required>
                    <option value="" disabled selected>Scegli un amministratore</option>
                    <option th:each="a : ${amministratori}" th:value="${a.id}"
                            th:text="${a.nome} + ' ' + ${a.cognome}">Nome Cognome</option>
                </select>
            </label>
            <p th:if="${recensione.id != null}"
               th:text="'Recensione su: ' + ${recensione.admin.nome} + ' ' + ${recensione.admin.cognome}">
                Amministratore
            </p>

            <label>Voto (1-5):
                <input type="number" th:field="*{voto}" min="1" max="5">
            </label>
            <span th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}" class="errore"></span>

            <label>Testo:
                <textarea th:field="*{testo}" rows="4"></textarea>
            </label>
            <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}" class="errore"></span>

            <button type="submit">Salva recensione</button>
        </form>

        <p><a th:href="@{/recensioni}">Annulla</a></p>
    </div>
</body>
</html>
