<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Modifica profilo</title>
</head>
<body>
<div class="container">
    <h1>Modifica i tuoi dati</h1>

    <form th:action="@{/profilo}" method="post" th:object="${utente}">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
        </div>

        <input type="hidden" th:field="*{id}">

        <label>Username: <input type="text" th:value="${username}" disabled></label>

        <label>Nome: <input type="text" th:field="*{nome}"></label>
        <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="errore"></span>

        <label>Cognome: <input type="text" th:field="*{cognome}"></label>
        <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="errore"></span>


        <button type="submit">Salva modifiche</button>
    </form>

    <p><a th:href="@{/}">Annulla</a></p>
</div>
</body>
</html>
