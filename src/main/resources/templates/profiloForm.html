<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Modifica profilo</title>
</head>
<body>
<div class="container">
    <h1>Modifica i tuoi dati</h1>

    <p th:if="${errore != null}" th:text="${errore}" class="errore">Messaggio di errore</p>

    <form th:action="@{/profilo}" method="post">
        <label>Username: <input type="text" th:value="${utente.username}" disabled></label>
        <label>Nome: <input type="text" name="nome" th:value="${utente.nome}"></label>
        <label>Cognome: <input type="text" name="cognome" th:value="${utente.cognome}"></label>
        <label>Email: <input type="email" name="email" th:value="${utente.email}"></label>
        <label>Telefono: <input type="text" name="telefono" th:value="${utente.telefono}"></label>

        <button type="submit">Salva modifiche</button>
    </form>

    <p><a th:href="@{/}">Annulla</a></p>
</div>
</body>
</html>
