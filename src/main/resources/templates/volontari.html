<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>I nostri volontari</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/animali}">Animali</a>
        <a th:href="@{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
    </nav>

    <div class="container">
        <h1>I nostri volontari</h1>

        <div class="card-grid">
            <div class="card" th:each="volontario : ${volontarioList}">
                <h3 th:text="${volontario.nome} + ' ' + ${volontario.cognome}">Nome Cognome</h3>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(volontarioList)}">Non ci sono ancora volontari registrati.</p>
    </div>
</body>
</html>
