<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Le mie richieste</title>
</head>
<body>
    <nav th:replace="~{fragments/nav :: navbarCompleta}"></nav>

    <div class="container">
        <div class="page-header-center">
            <h1 class="page-header-title">Le mie richieste di adozione</h1>
            <a th:href="@{/animali}" class="btn-nuovo">+ Nuova richiesta</a>

            <form th:action="@{/le-mie-richieste}" method="get" class="search-bar search-bar-compact"
                  id="form-ricerca-mie-richieste">
                <input type="text" name="cerca" id="cerca-mie-richieste"
                       th:value="${cerca}"
                       placeholder="Cerca per nome animale…"
                       aria-label="Cerca richiesta">
                <button type="submit">Cerca</button>
            </form>
        </div>

        <div class="card" th:each="richiesta : ${richieste}">
            <span th:switch="${richiesta.stato.name()}">
                <span th:case="'IN_ATTESA'" class="badge badge-in-valutazione">In attesa</span>
                <span th:case="'APPROVATA'" class="badge badge-disponibile">Approvata</span>
                <span th:case="'RIFIUTATA'" class="badge badge-adottato">Rifiutata</span>
            </span>

            <!-- Specifiche dell'animale richiesto -->
            <p th:text="'Nome: ' + ${richiesta.animale.nome}">Nome</p>
            <p th:text="'Specie: ' + ${richiesta.animale.specie}">Specie</p>
            <p th:text="'Razza: ' + (${richiesta.animale.razza != null and !richiesta.animale.razza.isEmpty()}
                        ? ${richiesta.animale.razza} : 'non indicata')">Razza</p>
            <p th:text="'Età: ' + (${richiesta.animale.eta != null}
                        ? ${richiesta.animale.eta} + ' anni' : 'non indicata')">Età</p>

            <p th:text="'Richiesta inviata il ' + ${#temporals.format(richiesta.dataRichiesta, 'dd/MM/yyyy')}">Data</p>

            <!-- Lo slot scelto: la relazione RichiestaAdozione -> Turno -->
            <p th:if="${richiesta.turno != null}"
               th:text="'Orario della visita: ' + ${#temporals.format(richiesta.turno.data, 'dd/MM/yyyy')}
                        + ' ore ' + ${#temporals.format(richiesta.turno.oraInizio, 'HH:mm')}
                        + ' - ' + ${#temporals.format(richiesta.turno.oraFine, 'HH:mm')}">Orario</p>
            <p th:if="${richiesta.turno == null}">Nessun orario associato, la richiesta è stata rifiutata.</p>

            <p th:if="${richiesta.motivazione != null and !richiesta.motivazione.isEmpty()}"
               th:text="'Motivo della richiesta: &quot;' + ${richiesta.motivazione} + '&quot;'">Motivazione</p>

           
            <div class="actions" th:if="${richiesta.stato.name() == 'IN_ATTESA'}">
                <a class="btn-action btn-modifica"
                   th:href="@{'/le-mie-richieste/' + ${richiesta.id} + '/modifica'}">Modifica</a>

                <form th:action="@{'/le-mie-richieste/' + ${richiesta.id} + '/elimina'}" method="post"
                      class="form-inline">
                    <button type="submit" class="btn-action btn-elimina"
                            onclick="return confirm('Annullare la richiesta?')">Annulla richiesta</button>
                </form>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(richieste)}">Non hai ancora inviato nessuna richiesta di adozione.</p>
    </div>
</body>
</html>
