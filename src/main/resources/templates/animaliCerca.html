<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Cerca animali</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/animali}">Animali</a>
        <a th:href="@{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
    </nav>

    <div class="container">
        <h1>Cerca animali disponibili</h1>
        <p>Pagina di ricerca realizzata in React: filtra gli animali disponibili per specie interrogando l'API REST del backend, senza ricaricare la pagina.</p>

        <div id="root"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

    <script type="text/babel" th:inline="none">
        const { useState, useEffect } = React;

        function badgeClass(stato) {
            if (stato === "DISPONIBILE") return "badge badge-disponibile";
            if (stato === "IN_VALUTAZIONE") return "badge badge-in-valutazione";
            return "badge badge-adottato";
        }

        function RicercaAnimali() {
            const [specie, setSpecie] = useState("");
            const [animali, setAnimali] = useState([]);
            const [caricamento, setCaricamento] = useState(true);
            const [errore, setErrore] = useState(null);

            useEffect(() => {
                setCaricamento(true);
                setErrore(null);

                const url = specie
                    ? "/api/animali?specie=" + encodeURIComponent(specie)
                    : "/api/animali";

                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Errore nella richiesta al server");
                        }
                        return response.json();
                    })
                    .then(dati => {
                        setAnimali(dati);
                        setCaricamento(false);
                    })
                    .catch(err => {
                        setErrore(err.message);
                        setCaricamento(false);
                    });
            }, [specie]);

            return (
                <div>
                    <label>
                        Filtra per specie:
                        <input
                            type="text"
                            placeholder="Es. Cane, Gatto, Coniglio..."
                            value={specie}
                            onChange={e => setSpecie(e.target.value)}
                        />
                    </label>

                    {caricamento && <p>Caricamento in corso...</p>}
                    {errore && <p className="errore">{errore}</p>}

                    {!caricamento && !errore && (
                        <div className="card-grid">
                            {animali.map(animale => (
                                <div className="card" key={animale.id}>
                                    <span className={badgeClass(animale.stato)}>
                                        {animale.stato === "DISPONIBILE" ? "Disponibile" : animale.stato}
                                    </span>
                                    <h3><a href={"/animali/" + animale.id}>{animale.nome}</a></h3>
                                    <p>{animale.specie} - {animale.razza}</p>
                                    <p>Età: {animale.eta}</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {!caricamento && !errore && animali.length === 0 && (
                        <p>Nessun animale trovato per questa ricerca.</p>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<RicercaAnimali />);
    </script>
</body>
</html>
