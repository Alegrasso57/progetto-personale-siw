<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${turno != null and turno.id != null} ? 'Modifica turno' : 'Nuovo turno'">Turno</title>
</head>
<body>
<div class="container">
    <h1 th:text="${turno != null and turno.id != null} ? 'Modifica turno' : 'Nuovo turno'">Nuovo turno</h1>

    <p th:if="${errore != null}" th:text="${errore}" class="errore">Messaggio di errore</p>

    <form th:action="@{/volontario/turni}" method="post">
        <input type="hidden" name="id" th:value="${turno != null ? turno.id : null}">

        <label>Data: <input type="date" name="data" th:value="${turno != null ? turno.data : null}"></label>
        <label>Ora inizio: <input type="time" name="oraInizio" th:value="${turno != null ? turno.oraInizio : null}"></label>
        <label>Ora fine: <input type="time" name="oraFine" th:value="${turno != null ? turno.oraFine : null}"></label>
        <label>Note: <textarea name="note" rows="3" th:text="${turno != null ? turno.note : null}"></textarea></label>

        <button type="submit" th:text="${turno != null and turno.id != null} ? 'Salva modifiche' : 'Crea turno'">Crea turno</button>
    </form>

    <p><a th:href="@{/volontario/turni}">Annulla</a></p>
</div>
</body>
</html>
