<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${turno.id != null} ? 'Modifica turno' : 'Nuovo turno'">Turno</title>
</head>
<body>
<div class="container">
    <h1 th:text="${turno.id != null} ? 'Modifica turno' : 'Nuovo turno'">Nuovo turno</h1>

    <p th:if="${errore != null}" th:text="${errore}" class="errore">Messaggio di errore</p>

    <form th:action="@{/volontario/turni}" method="post" th:object="${turno}">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
        </div>

        <input type="hidden" th:field="*{id}">

        <label>Data: <input type="date" th:field="*{data}"></label>
        <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="errore"></span>

        <label>Ora inizio: <input type="time" th:field="*{oraInizio}"></label>
        <span th:if="${#fields.hasErrors('oraInizio')}" th:errors="*{oraInizio}" class="errore"></span>

        <label>Ora fine: <input type="time" th:field="*{oraFine}"></label>
        <span th:if="${#fields.hasErrors('oraFine')}" th:errors="*{oraFine}" class="errore"></span>

        <label>Note: <textarea th:field="*{note}" rows="3"></textarea></label>

        <button type="submit" th:text="${turno.id != null} ? 'Salva modifiche' : 'Crea turno'">Crea turno</button>
    </form>

    <p><a th:href="@{/volontario/turni}">Annulla</a></p>
</div>
</body>
</html>
