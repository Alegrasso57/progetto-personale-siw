<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Animale</title>
</head>
<body>
<div class="container">
    <h1>Animale</h1>

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
    </div>

    <form th:action="@{/volontario/animali}" method="post" th:object="${animale}">
        <input type="hidden" th:field="*{id}">

        <label>Nome: <input type="text" th:field="*{nome}"></label>
        <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="errore"></span>

        <label>Specie: <input type="text" th:field="*{specie}"></label>
        <span th:if="${#fields.hasErrors('specie')}" th:errors="*{specie}" class="errore"></span>

        <label>Razza: <input type="text" th:field="*{razza}"></label>

        <label>Età: <input type="number" th:field="*{eta}" min="0" max="25"></label>
        <span th:if="${#fields.hasErrors('eta')}" th:errors="*{eta}" class="errore"></span>

        <label>Sesso: <input type="text" th:field="*{sesso}"></label>
        <label>Descrizione: <textarea th:field="*{descrizione}"></textarea></label>

        <label>Stato:
            <select th:field="*{stato}">
                <option th:each="stato : ${statiAnimale}"
                        th:value="${stato}"
                        th:text="${stato}">
                    Stato
                </option>
            </select>
        </label>

        <button type="submit">Salva</button>
    </form>

    <p><a th:href="@{/volontario/animali}">Annulla</a></p>
</div>
</body>
</html>
