<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Programmazione dei turni dei volontari al Rifugio Amico.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Programmazione turni — Rifugio Amico</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" th:if="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty}">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="@{/specie}">Specie</a>
        <a th:href="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
        <a th:href="@{/recensioni-volontari}">Recensioni</a>
    </nav>

    <div class="container">
        <div class="page-header-center">
            <h1 class="page-header-title">Programmazione turni</h1>

            <!-- Barra ricerca per data (server-side), centrata insieme al titolo -->
            <form th:action="@{/turni}" method="get" class="search-bar search-bar-compact" id="form-ricerca-turni">
                <input type="date" name="data" id="data-turni"
                       th:value="${dataSelezionata}"
                       aria-label="Seleziona data">
                <button type="submit">Cerca</button>
            </form>
        </div>

        <!-- Turni trovati -->
        <div th:each="turno : ${turnoList}" class="turno-card">
            <p class="turno-data"
               th:text="'Data : ' + ${#temporals.format(turno.data, 'dd/MM/yyyy')}">Data : GG/MM/AAAA</p>
            <p class="turno-ora"
               th:text="'Fascia oraria del turno : ' + ${#temporals.format(turno.oraInizio, 'HH:mm')} + ' - ' + ${#temporals.format(turno.oraFine, 'HH:mm')}">Fascia oraria</p>
            <p class="turno-info" th:if="${turno.animale != null}"
               th:text="'Animale: ' + ${turno.animale.nome}">Animale</p>
            <p class="turno-info" th:unless="${turno.animale != null}">Turno disponibile: nessuna visita ancora prenotata.</p>
            <p class="turno-info"
               th:text="'Volontario: ' + ${turno.volontario.nome} + ' ' + ${turno.volontario.cognome}">Volontario</p>
        </div>

        <p th:if="${#lists.isEmpty(turnoList)}">Nessun turno programmato per questa data.</p>
    </div>
</body>
</html>
