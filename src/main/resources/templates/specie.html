<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Le specie di animali che il Rifugio Amico accoglie e fa adottare.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Le nostre specie — Rifugio Amico</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
        <div class="nav-item-dropdown">
            <a th:href="@{/animali}">Animali</a>
            <div class="nav-dropdown-menu" th:if="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty}">
                <a th:href="@{/volontario/animali}">Gestione animali</a>
                <a th:href="@{/volontario/richieste}">Richieste di adozione da valutare</a>
                <a th:href="@{/animali}">Animali da adottare</a>
            </div>
        </div>
        <a th:href="@{/specie}">Specie</a>
        <a th:href="${userDetails != null and !userDetails.authorities.?[authority == 'VOLONTARIO'].empty} ? @{/volontario/turni} : @{/turni}">Turni</a>
        <a th:href="@{/volontari}">Volontari</a>
        <a th:href="@{/recensioni-volontari}">Recensioni</a>
    </nav>

    <div class="container">
        <div class="page-header-center">
            <h1 class="page-header-title">Le specie che trattiamo</h1>
        </div>

        <ul class="volontario-list" th:if="${!#lists.isEmpty(specieDisponibili)}">
            <li class="volontario-list-item" th:each="s : ${specieDisponibili}">
                <div class="volontario-avatar" th:text="${#strings.substring(s,0,1)}">A</div>
                <div class="volontario-info">
                    <a class="volontario-nome" th:href="@{'/animali?specie=' + ${s}}" th:text="${s}">Specie</a>
                    <span class="volontario-ruolo">Specie</span>
                </div>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(specieDisponibili)}">Nessuna specie disponibile al momento.</p>
    </div>
</body>
</html>
