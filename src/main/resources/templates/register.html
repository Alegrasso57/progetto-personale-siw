<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Registrati</title>
</head>
<body>
    <nav class="main-nav">
        <a th:href="@{/}">Home</a>
    </nav>

    <div class="container">
        <h1>Crea un account</h1>

        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="errore">Messaggio di errore</p>
        </div>

        <form th:action="@{/register}" method="post" th:object="${registrazioneForm}">
            <label>Username: <input type="text" th:field="*{username}"></label>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="errore"></span>

            <label>Password: <input type="password" th:field="*{password}"></label>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="errore"></span>

            <label>Nome: <input type="text" th:field="*{nome}"></label>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="errore"></span>

            <label>Cognome: <input type="text" th:field="*{cognome}"></label>
            <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="errore"></span>

            <label>Email: <input type="email" th:field="*{email}"></label>
            <label>Telefono: <input type="text" th:field="*{telefono}"></label>

            <label>Registrati come:
                <select th:field="*{ruolo}">
                    <option value="ADOTTANTE">Adottante (voglio adottare un animale)</option>
                    <option value="VOLONTARIO">Volontario (lavoro per il centro)</option>
                </select>
            </label>
            <span th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}" class="errore"></span>

            <div id="codiceVolontarioBox" style="display: none;">
                <label>Codice del centro: <input type="text" th:field="*{codiceVolontario}"></label>
                <small>Richiesto solo per registrarsi come volontario: te lo fornisce il centro per confermare che sei un dipendente.</small>
            </div>

            <button type="submit">Registrati</button>
        </form>

        <p><a th:href="@{/login}">Hai già un account? Accedi</a></p>
    </div>

    <script>
        // Mostra il campo "codice del centro" solo quando si seleziona il ruolo volontario,
        // così un semplice visitatore non vede nemmeno il campo se vuole solo adottare.
        const selectRuolo = document.getElementById('ruolo');
        const boxCodice = document.getElementById('codiceVolontarioBox');

        function aggiornaVisibilitaCodice() {
            boxCodice.style.display = (selectRuolo.value === 'VOLONTARIO') ? 'block' : 'none';
        }

        selectRuolo.addEventListener('change', aggiornaVisibilitaCodice);
        aggiornaVisibilitaCodice();
    </script>
</body>
</html>
